<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Code Gate</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    :root{color-scheme:light;font-family:"Geist",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1f;background:#f5f5f7}
    *{box-sizing:border-box}
    body{width:280px;margin:0;padding:20px}
    h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.2px}
    p{margin:8px 0 16px;color:#7a7a7a;font-size:14px;line-height:1.4}
    button{width:100%;min-height:42px;border:0;border-radius:9999px;background:#06c;color:#fff;font:500 14px "Geist",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;transition:transform .12s ease,background-color .18s ease}
    button:hover{background:#0071e3}button:active{transform:scale(.96)}button:focus-visible{outline:2px solid #0071e3;outline-offset:3px}
    #status[data-locked="false"]{color:#247a3e}
    #status[data-locked="true"]{color:#7a7a7a}
  </style>
</head>
<body>
  <main>
    <h1>Code Gate</h1>
    <p id="status" role="status" aria-live="polite">Проверяю состояние…</p>
    <button id="action" type="button" disabled>Подождите…</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
