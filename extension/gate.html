<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>Вход по коду</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="access" aria-labelledby="title">
    <h1 id="title">Вход по коду</h1>
    <p class="intro">Попросите владельца устройства создать одноразовый код доступа.</p>
    <form id="form" novalidate>
      <label class="sr-only" for="code">Шестизначный код</label>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" placeholder="Введите код" aria-describedby="status">
      <button type="submit">Продолжить</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <p class="footnote">Код одноразовый и действует 5 минут.</p>
  </main>
  <script src="anime.min.js"></script>
  <script src="motion.js"></script>
  <script src="gate.js"></script>
</body>
</html>
