<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>Выдать доступ</title>
  <link rel="stylesheet" href="extension/fonts.css">
  <style>
    *{box-sizing:border-box} :root{--font-ui:"Geist",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f7;color:#1d1d1f;font:400 17px/1.47 var(--font-ui);letter-spacing:-.374px;-webkit-font-smoothing:antialiased} main{width:min(100%,440px);text-align:center;animation:arrive .65s cubic-bezier(.2,.75,.25,1) both} h1{margin:0;font-size:40px;font-weight:600;line-height:1.1;letter-spacing:-.28px} p{margin:16px auto 24px;color:#333;max-width:360px} label{display:block;margin:0 0 8px;text-align:left;color:#7a7a7a;font-size:14px;letter-spacing:-.224px} input{width:100%;height:44px;padding:0 16px;border:1px solid rgba(0,0,0,.08);border-radius:9999px;background:#fff;color:#1d1d1f;font:400 15px var(--font-ui);letter-spacing:0;transition:border-color .2s,outline-color .2s} input:focus{outline:2px solid #0071e3;outline-offset:2px} button{min-height:44px;padding:11px 22px;border:0;border-radius:9999px;background:#06c;color:#fff;font:400 17px/1.3 var(--font-ui);cursor:pointer;transition:transform .18s cubic-bezier(.2,.75,.25,1),opacity .2s,background-color .2s} button:hover{background:#0071e3} button:active{transform:scale(.95)} button:disabled{opacity:.6;cursor:wait} #issue{width:100%;margin-top:12px} #lock{width:100%;margin-top:10px;background:transparent;border:1px solid #d2d2d7;color:#1d1d1f} #lock:hover{background:#e8e8ed} #copy{margin-top:12px;background:transparent;border:1px solid #06c;color:#06c} #code{margin-top:24px;font-size:40px;font-weight:600;letter-spacing:.12em;font-variant-numeric:tabular-nums;animation:arrive .32s ease both} #status{min-height:24px;margin-top:12px;font-size:14px;color:#7a7a7a;transition:opacity .2s} .hidden{display:none} .note{margin-top:32px;font-size:12px;color:#7a7a7a;letter-spacing:-.12px} @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <h1>Выдать доступ</h1>
    <p>Создайте одноразовый код и передайте его человеку, которому хотите открыть браузер.</p>
    <label for="secret">Секрет администратора</label>
    <input id="secret" type="password" autocomplete="current-password" placeholder="Введите секрет из настроек сервера">
    <button id="issue" type="button">Выдать доступ</button>
    <button id="lock" type="button">Заблокировать сейчас</button>
    <div id="code" class="hidden" aria-live="polite"></div>
    <button id="copy" class="hidden" type="button">Скопировать код</button>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="note">Код одноразовый и действует 5 минут.</div>
  </main>
  <script>
    const secret=document.getElementById('secret'), issue=document.getElementById('issue'), lock=document.getElementById('lock'), code=document.getElementById('code'), copy=document.getElementById('copy'), status=document.getElementById('status');
    issue.addEventListener('click',async()=>{
      status.textContent='Создаю код…'; code.classList.add('hidden'); copy.classList.add('hidden');
      try{
        const r=await fetch('/api/admin/code',{method:'POST',headers:{Authorization:`Bearer ${secret.value}`}});
        const data=await r.json(); if(!r.ok) throw new Error(r.status===401?'Секрет администратора не подошёл.':'Не удалось создать код.');
        code.textContent=data.code; code.classList.remove('hidden'); copy.classList.remove('hidden'); status.textContent='Передайте этот код пользователю.';
      }catch(e){status.textContent=e.message==='Failed to fetch'?'Не удалось связаться с сервером.':e.message;}
    });
    lock.addEventListener('click',async()=>{
      status.textContent='Блокирую браузер…'; lock.disabled=true;
      try{
        const r=await fetch('/api/admin/lock',{method:'POST',headers:{Authorization:`Bearer ${secret.value}`}});
        const data=await r.json(); if(!r.ok) throw new Error(r.status===401?'Секрет администратора не подошёл.':'Не удалось заблокировать.');
        code.classList.add('hidden'); copy.classList.add('hidden'); status.textContent='Доступ отозван. Браузер заблокируется в течение 30 секунд.';
      }catch(e){status.textContent=e.message==='Failed to fetch'?'Не удалось связаться с сервером.':e.message;}
      finally{lock.disabled=false;}
    });
    copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.textContent);status.textContent='Код скопирован.';}catch{status.textContent='Не удалось скопировать код.';}});
  </script>
</body>
</html>
